<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Prime | Agendamento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-container">
        
        <header class="barber-header">
            <div class="brand-info">
                <div class="barber-icon-container" style="width: 60px; height: 60px; margin: 0 auto 8px auto; background: #1C1C1C; border: 2px solid #D4AF37; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-scissors" style="font-size: 1.5rem; color: #D4AF37;"></i>
                </div>
                <div>
                    <h1>Studio Prime</h1>
                    <p>Agendamento Online</p>
                </div>
            </div>
        </header>

        <section class="section">
            <h2>1. Escolha o Profissional</h2>
            <div class="barbers-grid">
                <div class="barber-card active" onclick="selectBarber(this, 'Lucas')">
                    <i class="fa-solid fa-user-check barber-avatar"></i>
                    <h3>Lucas</h3>
                </div>
                <div class="barber-card" onclick="selectBarber(this, 'Mateus')">
                    <i class="fa-solid fa-user-check barber-avatar"></i>
                    <h3>Mateus</h3>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>2. Escolha os Serviços</h2>
            <div class="services-grid">
                
                <div class="service-card" onclick="toggleService(this, 'Corte', 35)">
                    <div class="service-info">
                        <h3><i class="fa-regular fa-square checkbox-icon"></i> Corte</h3>
                        <span><i class="fa-regular fa-clock"></i> 30 min</span>
                    </div>
                    <span class="price">R$ 35,00</span>
                </div>

                <div class="service-card" onclick="toggleService(this, 'Barba', 35)">
                    <div class="service-info">
                        <h3><i class="fa-regular fa-square checkbox-icon"></i> Barba</h3>
                        <span><i class="fa-regular fa-clock"></i> 30 min</span>
                    </div>
                    <span class="price">R$ 35,00</span>
                </div>

                <div class="service-card" onclick="toggleService(this, 'Sobrancelha', 15)">
                    <div class="service-info">
                        <h3><i class="fa-regular fa-square checkbox-icon"></i> Sobrancelha</h3>
                        <span><i class="fa-regular fa-clock"></i> 15 min</span>
                    </div>
                    <span class="price">R$ 15,00</span>
                </div>

                <div class="service-card" onclick="toggleService(this, 'Selagem', 70)">
                    <div class="service-info">
                        <h3><i class="fa-regular fa-square checkbox-icon"></i> Selagem</h3>
                        <span><i class="fa-regular fa-clock"></i> 45 min</span>
                    </div>
                    <span class="price">R$ 70,00</span>
                </div>

                <div class="service-card" onclick="toggleService(this, 'Luzes', 90)">
                    <div class="service-info">
                        <h3><i class="fa-regular fa-square checkbox-icon"></i> Luzes</h3>
                        <span><i class="fa-regular fa-clock"></i> 60 min</span>
                    </div>
                    <span class="price">R$ 90,00</span>
                </div>

            </div>
        </section>

        <section class="section">
            <h2>3. Data e Horário</h2>
            <div class="datetime-inputs">
                <div class="input-group">
                    <label for="date"><i class="fa-regular fa-calendar"></i> Data:</label>
                    <input type="date" id="date" onclick="this.showPicker && this.showPicker()" onchange="checkAvailableTimes()">
                </div>
                
                <div class="input-group">
                    <label for="time"><i class="fa-regular fa-clock"></i> Horário:</label>
                    <select id="time">
                    </select>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>4. Os Seus Dados</h2>
            <div class="client-inputs" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="client-name" placeholder="Seu Nome Completo">
                <input type="tel" id="client-phone" placeholder="Seu WhatsApp (com DDD)">
            </div>
        </section>

        <footer class="footer-action">
            <button class="btn-whatsapp" id="btn-agendar" onclick="sendToWhatsapp()">
                <i class="fa-brands fa-whatsapp"></i> Agendar pelo WhatsApp
            </button>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
